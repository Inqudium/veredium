site_name: Veredium
site_description: A web client implementation - the post-horse that carries the envoy
site_url: https://inqudium.github.io/veredium/
repo_url: https://github.com/Inqudium/veredium
repo_name: Inqudium/veredium
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo/veredium-icon.svg
  favicon: logo/veredium-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

# Internal analysis reports - not site pages (tabellarium template pattern).
exclude_docs: |
  assessment/

nav:
  - Home: index.md
  # The long-form guides live next to their module sources (outside this
  # docs_dir). .github/scripts/generate-guide-pages.py copies them (plus
  # their companion files) under docs/guides/ with rewritten links in the
  # Docs workflow; not checked in - run the script before building
  # locally, or the --strict build fails (which is the guard against a
  # hand-maintained, drifting copy).
  - Core (veredium-core):
      - Guide: guides/veredium-core/GUIDE.md
      - Mesh timeout ladder: guides/veredium-core/mesh-timeout.md
  - Blocking client (veredium-restclient):
      - Guide: guides/veredium-restclient/GUIDE.md
      - Timeouts, bulkheads and threads: guides/veredium-restclient/timeouts-bulkheads-threads.md
      - Metrics: guides/veredium-restclient/metrics.md
      - Versus the reactive client: guides/veredium-restclient/restclient-vs-webclient.md
      - Decisions: guides/veredium-restclient/decisions.md
  - Reactive client (veredium-webclient):
      - Guide: guides/veredium-webclient/GUIDE.md
      - Configuration guide: guides/veredium-webclient/webclient-config-guide.md
      - Metrics: guides/veredium-webclient/metrics.md
      - Logging guide: guides/veredium-webclient/logging-guide.md
  - HTTP engine behaviour: engine-behaviour.md
  # Generated by .github/scripts/generate-test-catalog.py in the Docs
  # workflow (after `mvn verify`); not checked in - run the script before
  # building locally, or the --strict build fails (which is the guard
  # against a hand-maintained, drifting copy).
  - Test evidence: tests/test-evidence.md
  - Coverage report: https://inqudium.github.io/veredium/coverage/
  - API reference:
      - veredium-core: https://inqudium.github.io/veredium/api/veredium-core/
      - veredium-restclient: https://inqudium.github.io/veredium/api/veredium-restclient/
      - veredium-webclient: https://inqudium.github.io/veredium/api/veredium-webclient/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Collapsible rationale blocks on the generated test-evidence page.
  - pymdownx.details
  - tables
