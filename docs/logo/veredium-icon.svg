<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Veredium element tile">
  <style>
    :root { --ink:#26221c; --road:#1f7a6d; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6e1d6; --road:#3fb59f; } }
    text { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: var(--ink); }
  </style>
  <!-- element tile, like the siblings' -->
  <rect x="10" y="10" width="108" height="108" rx="10" fill="none" stroke="var(--ink)" stroke-width="6"/>
  <!-- element symbol -->
  <text x="64" y="78" font-size="48" font-weight="700" text-anchor="middle">Vr</text>
  <!-- the post road: it crosses the tile from edge to edge, and the two posts are the stations
       (mutationes) where the veredus is changed - the horse runs the stretch between them -->
  <rect x="6" y="90" width="116" height="5" fill="var(--road)"/>
  <rect x="30" y="84" width="5" height="17" rx="1" fill="var(--road)"/>
  <rect x="93" y="84" width="5" height="17" rx="1" fill="var(--road)"/>
  <!-- element name -->
  <text x="64" y="112" font-size="9.5" letter-spacing="2.5" text-anchor="middle">VEREDIUM</text>
</svg>
