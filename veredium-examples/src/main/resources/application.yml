# The configuration of every example. The blocking, asynchronous and reactive examples run on one client module each
# (they exclude the other's auto-configuration), so the endpoints below name no stack; app.mesh is shared by them. The
# mixed example runs both modules and assigns each endpoint its stack in application-mixed.yml. The decorator example
# uses no client and reads legacy-directory and its own Resilience4j instances.

spring:
  application:
    name: veredium-examples
  main:
    # The examples call backends; they serve nothing. Without this, spring-webflux on the classpath would start a
    # reactive web server.
    web-application-type: none

# legatium: one structured exchange event per call on the adapter-http-exchange logger.
adapter-logging:
  enabled: true
  logger-name: adapter-http-exchange
  request-headers:
    includes: ["*"]
    masked: ["Authorization"]

# The decorator example's legacy backend, reached through the sidecar like the others.
legacy-directory:
  base-url: "http://localhost:8042"
  host: customers.example.com
  connect-timeout: 100ms
  response-timeout: 700ms
  max-connections: 10

app:
  restclient:
    max-in-memory-size: 256KB
    # The HTTP engine, for all backends or per backend (key = mesh alias). Apache is the default; jetty and
    # reactor-netty also need their library on the classpath.
    # engine:
    #   default: apache
    #   endpoints:
    #     order-search: jetty
  webclient:
    max-in-memory-size: 256KB
  mesh:
    defaults:
      transport:
        # Every call goes to the local sidecar, which routes it by the Host header the triplet names.
        sidecar-base-url: "http://localhost:8042"
    endpoints:
      # The triplet is the backend's identity: /endpoint/<host>/<METHOD>/<path template>. The ladder derives the
      # response timeout and the TimeLimiter budget from the measured per-attempt time.
      - triplet: "/endpoint/customers.example.com/GET/v1/customers/{id}"
        alias: customers
        individual-request-timeout-ms: 300
      - triplet: "/endpoint/orders.example.com/POST/v1/orders/search"
        alias: order-search
        individual-request-timeout-ms: 500

# One instance per alias and layer - the startup guard fails the start when one is missing. The base config is the
# operator's policy; the mesh customizers lay the derived budget and the verdicts over it.
resilience4j:
  timelimiter:
    configs:
      mesh-backend:
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      customers:
        base-config: mesh-backend
      order-search:
        base-config: mesh-backend
      legacy-directory:
        timeout-duration: 1s
        # Required by BlockingResilienceDecorator: without it the worker is not interrupted at the budget.
        cancel-running-future: true
  bulkhead:
    configs:
      mesh-backend:
        max-concurrent-calls: 25
        max-wait-duration: 0
    instances:
      customers:
        base-config: mesh-backend
      order-search:
        base-config: mesh-backend
      legacy-directory:
        max-concurrent-calls: 10
        max-wait-duration: 0
  circuitbreaker:
    configs:
      mesh-backend:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 10
    instances:
      customers:
        base-config: mesh-backend
      order-search:
        base-config: mesh-backend
      legacy-directory:
        base-config: mesh-backend
