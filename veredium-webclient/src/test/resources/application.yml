# REFERENCE configuration of veredium-webclient: the documented example a host copies from. It is a TEST
# resource - a library ships no application.yml, so nothing here reaches a consumer of the artefact. The tests
# pin it so the example stays true: ResilienceConfigContractTest (aliases declared, bulkheads within the pool),
# MeshResilienceShippedConfigTest (Resilience4j's auto-configuration booted on it), and
# LegatiumExchangeLoggingIntegrationTest / WebClientPropertiesTest (the adapter-logging and app.webclient
# blocks). LoggingLevelContractTest reads the test-owned fixture application-test.yml instead;
# ResilienceConfigContractTest checks both files.

logging:
  level:
    # Framework noise off; this module's own classes stay verbose on purpose.
    root: INFO
    eu:
      inqudium:
        veredium: DEBUG
    # The exchange stream: one event per outbound HTTP exchange, written by legatium-webclient-logging (see the
    # adapter-logging block below). INFO = every call; WARN = only failures, timeouts, cancellations, slow
    # calls and the 401/403/408/429 rejections; ERROR = only calls that threw. Raising this level FILTERS the
    # stream instead of switching it off - severity and semantics are decoupled, dashboards key on
    # adapter_outcome. Both names are pinned by LoggingLevelContractTest (in the fixture application-test.yml).
    adapter-http-exchange: INFO
    # The library's own logger: the immediate WARN breadcrumb when a call throws, and errors of the logging
    # itself (fail-open lines). Keep at WARN or lower - silencing it hides the breadcrumb. DEBUG adds the wiring
    # report at context start - which builders got the filter, which properties bound (since legatium 1.2.0).
    eu.inqudium.legatium.webclient.logging: WARN

# =====================================================================================================
# WebClient adapter-logging of 'eu.inqudium:legatium-webclient-logging'
# =====================================================================================================
adapter-logging:
  # Master switch. `false` removes the module entirely - the auto-configuration backs off, no
  # interceptor/filter, no customizer, no beans.
  enabled: true

  # Logger the exchange events are emitted on.
  logger-name: adapter-http-exchange

  # Optionally log an ARRIVAL line the moment the request is sent, before the wire call is made.
  log-request-start: false

  # At or above this duration the call escalates from INFO to WARN and is flagged `adapter_slow: true`
  slow-request-threshold: 2s

  # Header logging, one section per direction, rendered into one display-only field each
  # (`adapter_request_headers` / `adapter_response_headers`).
  request-headers:
    includes: ["*"]
    masked: ["X-Access-Token"]
  response-headers:
    includes: [ "*" ]
    masked: ["X-Access-Token"]
    #  - Content-Type

  # Body logging per direction - a MODE, not a switch (ADR-0006): `never` (the default), `on-failure`
  # or `always`. `on-failure` is the volume switch: the body is logged only when `adapter_outcome` is
  # not `success` (failure, timeout, cancelled) or the status is a 4xx - orders of magnitude fewer bytes
  # than `always`
  log-request-body: always
  log-response-body: always

  # Body SIZE measurement per direction (meters `adapter.request.body.size` / `adapter.response.body.size`,
  # tagged by the URI template and the peer host).
  measure-request-body-size: true
  measure-response-body-size: true

  # Capture limit per body, in bytes. Bounds MEMORY, not the exchange: bytes beyond the limit still
  # reach the peer respectively the application unchanged - only the logged value is truncated, with an
  # explicit note of the total size.
  max-body-bytes: 16384

  # Keys the masking fingerprint. Empty (the default) keeps the unkeyed length:hash fingerprint; any other value
  # turns it into an HMAC-SHA256 under this key, so a log reader without the key cannot confirm a guessed value by
  # hashing it. A SECRET in a real host: supply it like one (environment variable, vault-backed property), never
  # as a literal in a checked-in file. The literal here is a placeholder that puts the tests binding this file on
  # the keyed path.
  masking-key: "example-masking-key"

app:
  webclient:
    # Upper bound on a buffered response body. 256 KB is Spring's own ExchangeStrategies default; 8 KB rejects
    # a real access-profile list. The bound applies per concurrently buffered response, so increases must still
    # be chosen deliberately. It does not bound what is LOGGED of a body - that is adapter-logging.max-body-bytes
    # above, an independent number.
    # Applied to the clone of Boot's builder after Boot's codec customizer ran, so it wins over
    # spring.http.codecs.max-in-memory-size for these clients (webclient-config-guide.md, "max-in-memory-size").
    #
    # A response that exceeds it fails the call with a DataBufferLimitException, wrapped by Spring into a
    # WebClientResponseException reporting 200. That is a CLIENT-side refusal - the backend answered correctly -
    # so it does not count towards the circuit breaker; WebClientVerdicts discounts it.
    max-in-memory-size: 256KB
    # The User-Agent every client sends. Unset = the library's token veredium/<version>; a host read per caller
    # in its peers' access logs names itself instead (an endpoint's static headers under app.mesh still win).
    # user-agent: my-service/2.3
    # The HTTP engine of these clients - reactor-netty (code default, shown explicitly), jdk, jetty or apache - with
    # per-alias overrides keyed like validation.endpoints below. Scoped to this module: Boot's own switch
    # spring.http.clients.reactive.connector is neither read nor changed, so the host's other WebClients keep
    # theirs. A key that names no mesh alias, or an engine whose library is missing, fails the start naming the
    # key; jdk also needs the JVM started with -Djdk.httpclient.allowRestrictedHeaders=host (the Host header).
    # What each engine applies of the mesh transport and pool settings: webclient-config-guide.md, "engine.* — the
    # HTTP engine".
    engine:
      default: reactor-netty
      endpoints: {}
      #   apis-example-com-GET-v6-involved-parties: jetty     # move ONE backend, e.g. to try an engine
    observability:
      # Whether Boot's ObservationRegistry stays on the cloned builder (client spans, the http.client.requests
      # timer, the outgoing traceparent) or is replaced by NOOP for these clients. The code default is OFF
      # (opt-in, WebClientProperties.Observability); this reference configuration sets it on, so a host that copies it gets
      # observed calls and legatium's traced identity (trace id as request id) whenever the host has a tracer.
      # Effective only with a recording ObservationRegistry bean - the factory's startup line reports the
      # difference between "on" and "on, but nothing is observed".
      http-observation-enabled: true
    # Whether a deserialised response is checked against its DTO's Bean Validation constraints. Default OFF,
    # because the constraints are generated from the published OpenAPI specs and those are stricter than
    # reality in places (e.g. @Size(min = 1) on a result list a lookup may legitimately return empty). Adopt
    # one backend at a time, against real traffic, via a per-alias override.
    #
    # The toggle lives HERE while the endpoint lives under app.mesh.endpoints[] below - the two are linked by
    # the endpoint's ALIAS, i.e. the mesh-derived R4j instance name: host-METHOD-<static path segments>, with
    # the host's dots turned into dashes and any {placeholder} segment dropped. So the endpoint
    #   - triplet: "/endpoint/apis.example.com/GET/v6/involved-parties/{uuid}"
    # has the alias `apis-example-com-GET-v6-involved-parties`, and is switched on with (drop the `# ` to enable):
    # validation:
    #   enabled: false                                       # shared default (off)
    #   endpoints:
    #     apis-example-com-GET-v6-involved-parties: true         # only THIS backend validates
    #
    # A per-alias entry wins in BOTH directions, so the mirror case - validate everywhere but exempt the one
    # endpoint whose spec is wrong - is the same shape with the booleans flipped:
    # validation:
    #   enabled: true                                        # shared default (on)
    #   fail-on-violation: false                             # SHARED: report only, do not fail the call (see below)
    #   endpoints:
    #     apis-example-com-POST-v8-agreements-products-lookup: false   # ...except this one
    #
    # An alias with no entry inherits `enabled`. A misspelt key matches no backend and silently falls back to
    # the default, so keep it in sync with the derived alias (the startup log prints the effective set).
    #
    # fail-on-violation (SHARED, default true): whether a detected violation FAILS the call with a
    # ConstraintViolationException, or is only REPORTED (logged at WARN, the response returned unchanged). Set it
    # false to watch a newly-enabled backend against real traffic before enforcing. It is one posture for the
    # whole app, deliberately not per-endpoint - the per-alias choice is only WHICH backends validate.
    #
    # REFERENCE: on everywhere, report only. The code default is off; this file shows the adoption posture
    # instead - every backend's response is checked, a violation is logged at WARN and the response returned
    # unchanged, so the generated constraints are measured against real traffic before any of them may fail a
    # call. To enforce, flip fail-on-violation (one posture for the whole app); to exempt a backend whose spec
    # is known to be stricter than reality, add it under endpoints with `false`.
    validation:
      enabled: true
      fail-on-violation: false
  # The single per-endpoint tree (see docs/mesh-timeout.md). Each endpoint drives BOTH the WebClient target
  # (baseUrl = the sidecar; the Host header is derived from the triplet host) AND the full timeout ladder
  # (connect / response / pending-acquire / max-connections + the per-endpoint TimeLimiter and slow-call).
  # No explicit alias: the logical backend name (R4j instance + metric label) is DERIVED from the triplet
  # (host-METHOD-path), so it is the single source of the endpoint identity. A host's adapters pass that derived
  # value to ResilientWebClientFactory.create, and the resilience4j instance keys below must equal it
  # (ResilienceConfigContractTest checks every derived alias against all three instance trees).
  #
  # Per-endpoint feature toggles live here too, tri-state (unset inherits app.mesh.defaults):
  #   time-limiter.enabled    (default true)  - whether mesh derives + overrides that endpoint's TimeLimiter budget
  #   circuit-breaker.enabled (default false) - whether mesh derives that endpoint's slow-call CircuitBreaker knob
  # `false` does NOT disable the R4j backend - it leaves that backend's own config untouched (BackendToggle).
  #
  # Shared default for every endpoint, under app.mesh.defaults (drop the `# ` to apply):
  #   defaults:
  #     circuit-breaker:
  #       enabled: true                        # let mesh derive the slow-call threshold for ALL endpoints
  #     time-limiter:
  #       enabled: true
  #
  # ...or per endpoint, which wins over the default in BOTH directions - here CB on, TimeLimiter left untouched:
  #     - triplet: "/endpoint/apis.example.com/POST/v8/agreements/products/lookup"
  #       individual-request-timeout-ms: 400
  #       circuit-breaker:
  #         enabled: true                      # derive this endpoint's slow-call knob (overrides the default off)
  #       time-limiter:
  #         enabled: false                     # keep this endpoint's TimeLimiter at its own resilience4j config
  # (Response validation is NOT a mesh feature - it is switched under app.webclient.validation above.)
  mesh:
    # app.mesh.defaults is omitted: every endpoint sets its own measured anchor, and the policy knobs
    # (max-retries, margins {global-margin-ms, ...}, transport) default in Kotlin. Add a defaults block only to tune.
    endpoints:
      - triplet: "/endpoint/apis.example.com/POST/v8/agreements/products/lookup"
        individual-request-timeout-ms: 400
      - triplet: "/endpoint/api.example.com/GET/v5/access-profiles/by-involved-party/{id}"
        individual-request-timeout-ms: 300
      - triplet: "/endpoint/apis.example.com/POST/v5/involved-parties/lookup"
        individual-request-timeout-ms: 500
      - triplet: "/endpoint/apis.example.com/GET/v6/involved-parties/{uuid}"
        individual-request-timeout-ms: 400

resilience4j:
  # TimeLimiter, Bulkhead and CircuitBreaker are declared for EVERY backend below. All three primitives sit in
  # the call path unconditionally (ReactiveResilienceDecorator applies all three, regardless of the app.mesh
  # toggles), so leaving one undeclared does not mean "off" - it means that backend silently runs on
  # Resilience4j's own defaults, at values nobody had chosen and nothing documented. The instance keys are the
  # mesh-derived aliases (ResilienceConfigContractTest checks that every alias is declared under all three).
  #
  # The TimeLimiter entries have a second job: Resilience4j's Boot configuration materialises exactly the
  # `instances.<name>` listed here, and the mesh customizer (veredium-core, MeshResilienceCustomizers) sets the
  # derived budget on every endpoint whose time-limiter toggle is on (the default) WHILE that instance is built.
  # An alias an endpoint uses but this block does not declare still gets an instance (Resilience4j creates one
  # for the customizer) - on the registry default, not on mesh-backend, silently; MeshResilienceStartupGuard
  # therefore fails the start and names the missing key. MeshResilienceShippedConfigTest boots the
  # auto-configuration on this file and would fail on an undeclared alias.
  timelimiter:
    configs:
      mesh-backend:
        # A fallback only: the mesh customizer sets every enabled instance to the derived timeout (see
        # veredium-core/docs/mesh-timeout.md), so 3s is only the fallback for an endpoint whose time-limiter
        # toggle is switched off. cancel-running-future is the Resilience4j default, written out so the budget
        # expiry visibly cancels the subscription rather than letting the call run on.
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      apis-example-com-POST-v8-agreements-products-lookup:
        base-config: mesh-backend
      api-example-com-GET-v5-access-profiles-by-involved-party:
        base-config: mesh-backend
      apis-example-com-POST-v5-involved-parties-lookup:
        base-config: mesh-backend
      apis-example-com-GET-v6-involved-parties:
        base-config: mesh-backend

  # The values below are the Resilience4j defaults, written out DELIBERATELY: making them visible and
  # reviewable is the point, and pinning them here means a library upgrade cannot change this application's
  # behaviour behind its back. Tune them against real traffic - the notes say what each one costs.
  bulkhead:
    configs:
      mesh-backend:
        # Bound by the SHARED connection pool, not chosen per backend: every endpoint talks to the same local
        # sidecar through one Reactor-Netty pool of app.mesh.defaults.transport.max-connections (100). With
        # four backends, 4 x 25 = 100 - the bulkheads shed load exactly as the pool runs out, rather than
        # letting callers pile up on pendingAcquire. Raising this without raising max-connections moves the
        # queueing into the pool, where pending-acquire-timeout-ms (200) fails them anyway, only later and
        # with a less obvious error - a FAILURE on the breaker of whichever backend is waiting.
        # ResilienceConfigContractTest enforces sum(max-concurrent-calls) <= max-connections for this file; at
        # runtime MeshResilienceStartupGuard (veredium-core) logs a WARN naming both numbers when a host's
        # configuration exceeds it.
        max-concurrent-calls: 25
        # Fail fast rather than queue: the same choice the mesh transport already makes for the pool. A waiting
        # caller does not even spend its TimeLimiter budget on the wait - the reactive bulkhead acquires inside
        # subscribe(), before the budget's timer starts - it blocks the subscribing thread for up to this long,
        # unbounded by the ladder (pinned in ReactiveResilienceDecoratorTest).
        max-wait-duration: 0
        #
        # ROLE: these bulkheads are a POOL PARTITION and a BACKSTOP - not a load-steering mechanism. They exist
        # so one hot alias cannot starve the other three out of the shared 100-connection pool, and so
        # exhaustion surfaces as an immediate, named BulkheadFullException rather than as pending-acquire
        # queueing. Callers are expected to bound their own concurrency BEFORE reaching here, dimensioned
        # against this very number (one logical operation may occupy one slot in each of two aliases at the
        # same instant).
        #
        # A BulkheadFullException on a known path is therefore a SIGNAL, not the design working: it says that
        # the caller's own bound is mis-sized, or that a second caller in the same JVM is consuming more of the
        # alias than assumed. Raising this value is the wrong first response; sum(max-concurrent-calls) <=
        # max-connections is enforced for this file by ResilienceConfigContractTest (and warned about at startup
        # by MeshResilienceStartupGuard), and raising it here without raising the pool just moves the queueing.
        # The decision this inherits is recorded in veredium-restclient/docs/decisions.md (D1).
    instances:
      apis-example-com-POST-v8-agreements-products-lookup:
        base-config: mesh-backend
      api-example-com-GET-v5-access-profiles-by-involved-party:
        base-config: mesh-backend
      apis-example-com-POST-v5-involved-parties-lookup:
        base-config: mesh-backend
      apis-example-com-GET-v6-involved-parties:
        base-config: mesh-backend

  circuitbreaker:
    configs:
      mesh-backend:
        # NOTE: a bulkhead rejection is NOT counted as a backend failure - see WebClientVerdicts, whose
        # client-side-failure verdict the mesh customizer installs on every instance below while Resilience4j
        # builds it. That invariant lives in code on purpose, so it cannot be lost by an edit to this block.
        #
        # SCOPE: every MESH ALIAS, and only those. One customizer exists per meshProperties.resolveAll() alias,
        # so they reach exactly the instances listed under `instances:` below. Breakers a host constructs
        # elsewhere do NOT inherit this invariant and must carry their own ignore list; see
        # veredium-restclient/docs/decisions.md (D1).
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        # CAVEAT worth knowing before relying on this breaker: COUNT_BASED with a minimum of 100 means it
        # cannot open until 100 calls have been recorded in the window. On a low-traffic backend that point
        # may be reached rarely or never, so the breaker is closer to dormant than to protective. Kept at the
        # default because choosing a smaller window is a traffic-dependent decision and needs real numbers;
        # a TIME_BASED window is the usual answer once they exist.
        sliding-window-size: 100
        minimum-number-of-calls: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 10
        # The slow-call detector is INERT here, and deliberately so: the TimeLimiter already cancels every
        # call at the mesh-derived budget (~1.1-1.6s), so nothing survives long enough to reach a 60s slow-call
        # threshold. Mesh can derive a meaningful threshold instead - that is what app.mesh's per-endpoint
        # circuit-breaker.enabled toggle switches on (default off); it then also pins the rate to 100%.
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 60s
    instances:
      apis-example-com-POST-v8-agreements-products-lookup:
        base-config: mesh-backend
      api-example-com-GET-v5-access-profiles-by-involved-party:
        base-config: mesh-backend
      apis-example-com-POST-v5-involved-parties-lookup:
        base-config: mesh-backend
      apis-example-com-GET-v6-involved-parties:
        base-config: mesh-backend
