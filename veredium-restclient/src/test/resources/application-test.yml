# Test-owned configuration fixture. The mesh/resilience4j/logging CONTRACT and BINDING tests bind THIS file
# (via ClassPathResource("application-test.yml")) for the VALUES they pin - a level, a body mode, a threshold,
# an anchor - so that operational edits to the shipped src/main/resources/application.yml never break the
# tests. IDENTITIES and INVARIANTS - the alias set, the resilience4j instance keys, the exchange logger's name
# against its level line, the bulkhead sum against the pool - are pinned in BOTH files (see the test helper
# ConfigurationFiles): nobody tunes those by hand, and a drift in the shipped file has to fail the build.
# Keep this file in sync with the shipped one only for the parts a test actually asserts; it may otherwise
# diverge (that divergence is the whole point of decoupling).
#
# NOT a Spring profile override in disguise: no test activates the `test` profile, so Spring never auto-merges
# this into a @SpringBootTest context; the contract/binding tests load it explicitly by name.

logging:
  level:
    # Framework noise off; this module's own classes stay verbose on purpose.
    root: INFO
    com:
      ing: DEBUG
    # The exchange stream: one event per outbound HTTP exchange, written by legatium-restclient-logging (see the
    # adapter-logging block below). INFO = every call; WARN = only failures, timeouts, cancellations, slow
    # calls and the 401/403/408/429 rejections; ERROR = only calls that threw. Unlike the module's former exchange diary, raising this level FILTERS
    # the stream instead of switching it off - severity and semantics are decoupled, dashboards key on
    # adapter_outcome. Both names are pinned by LoggingLevelContractTest.
    adapter-http-exchange: INFO
    # The library's own logger: the immediate WARN breadcrumb when a call throws, and errors of the logging
    # itself (fail-open lines). Keep at WARN or lower - silencing it hides the breadcrumb. DEBUG adds the wiring
    # report at context start - which builders got the filter, which properties bound (legatium 1.2.0).
    eu.inqudium.legatium.restclient.logging: WARN

# Outbound exchange logging (legatium-restclient-logging). The full reference with every default and its
# reasoning is the library's docs/adapter-logging-reference.yml; only what this module sets differently from the
# default is explained here. The interceptor reaches every RestClient of ResilientRestClientFactory through Boot's
# RestClient.Builder bean; the backend name reaches the event as adapter_name through a request attribute the
# factory sets.
adapter-logging:
  # Explicit although it is the default: this is a CONTEXT-START switch - false removes filter and customizer,
  # not just the lines. Whoever switches it off should see it here, not discover it in a missing stream.
  enabled: true
  # The library's default logger name, kept so its documentation applies verbatim.
  logger-name: adapter-http-exchange
  request-headers:
    # The former diary logged every request header; the runbook reads them (the Host header, the token's
    # fingerprint). Everything selected is MASKED by default (masked: ["*"]); plaintext is an allowlist.
    includes: ["*"]
    # Plaintext only for headers that carry no secret. Host is the second view of the backend next to
    # adapter_name. Everything else - X-Access-Token, Authorization, cookies, the unknown - stays a
    # fingerprint (<length>:<8 bytes SHA-256 hex>), which is stricter than the diary's prefix-only masking.
    unmasked: ["Host", "Accept", "Content-Type", "Content-Length", "User-Agent", "traceparent", "tracestate"]
  response-headers:
    includes: ["*"]
    # Same rule. Which correlation headers the sidecar returns is not documented in this repository; they show
    # up masked first and are added here after being seen.
    unmasked: ["Content-Type", "Content-Length", "Date", "Cache-Control"]
  # Bodies on every outcome but success (a failure, a rejected 4xx, a cancel): the diary logged every request
  # body of a POST and every response body - customer data on every line. The error body is what the runbook
  # needs.
  log-request-body: on-failure
  log-response-body: on-failure
  # The default, explicit because it replaces the diary's 256 KB (which was derived from the codec limit):
  # 16 KB is plenty for the backends' JSON error answers. Raise it here, never via the codec limit.
  max-body-bytes: 16384
  # The adapters build their paths from templates; no token ever travels in the query.
  include-query-string: true
  # Default. The mesh timeout ladder cancels calls long before 5 s, so adapter_slow will practically never
  # fire; a lower value without a measurement would be a number without a reason.
  slow-request-threshold: 5s

app:
  restclient:
    # Mirrors the shipped buffer ceiling. Tests that need a smaller boundary pass it explicitly.
    #
    # A response that exceeds it fails the call with a ResponseBodyLimitExceededException. That is a CLIENT-side
    # refusal - the backend answered correctly - so it does not count towards the circuit breaker;
    # ClientSideFailurePolicy discounts it.
    max-in-memory-size: 256KB
    # Whether a deserialised response is checked against its DTO's Bean Validation constraints. Default OFF,
    # because the constraints are generated from the published OpenAPI specs and those are stricter than
    # reality in places (e.g. @Size(min = 1) on a result list a lookup may legitimately return empty). Adopt
    # one backend at a time, against real traffic, via a per-alias override.
    #
    # The toggle lives HERE while the endpoint lives under app.mesh.endpoints[] below - the two are linked by
    # the endpoint's ALIAS, i.e. the mesh-derived R4j instance name: host-METHOD-<static path segments>, with
    # the host's dots turned into dashes and any {placeholder} segment dropped. So the endpoint
    #   - triplet: "/endpoint/apis.example.com/GET/v6/involved-parties/{uuid}"
    # has the alias `apis-example-com-GET-v6-involved-parties`, and is switched on with (drop the `# ` to enable):
    # validation:
    #   enabled: false                                       # shared default (off)
    #   endpoints:
    #     apis-example-com-GET-v6-involved-parties: true         # only THIS backend validates
    #
    # A per-alias entry wins in BOTH directions, so the mirror case - validate everywhere but exempt the one
    # endpoint whose spec is wrong - is the same shape with the booleans flipped:
    # validation:
    #   enabled: true                                        # shared default (on)
    #   fail-on-violation: false                             # SHARED: report only, do not fail the call (see below)
    #   endpoints:
    #     apis-example-com-POST-v8-agreements-products-lookup: false   # ...except this one
    #
    # An alias with no entry inherits `enabled`. A misspelt key matches no backend and silently falls back to
    # the default, so keep it in sync with the derived alias (the startup log prints the effective set).
    #
    # fail-on-violation (SHARED, default true): whether a detected violation FAILS the call with a
    # ConstraintViolationException, or is only REPORTED (logged at WARN, the response returned unchanged). Set it
    # false to watch a newly-enabled backend against real traffic before enforcing. It is one posture for the
    # whole app, deliberately not per-endpoint - the per-alias choice is only WHICH backends validate.
    #
    # Omitted entirely here: the shipped default is off, so there is nothing to set. To adopt validation,
    # uncomment ONE of the `validation:` blocks above (not both - they are alternatives).
  # The single per-endpoint tree (see docs/mesh-timeout.md). Each endpoint drives BOTH the RestClient target
  # (baseUrl = the sidecar; the Host header is derived from the triplet host) AND the full timeout ladder
  # (connect / response / pending-acquire / max-connections + the per-endpoint TimeLimiter and slow-call).
  # No explicit alias: the logical backend name (R4j instance + metric label) is DERIVED from the triplet
  # (host-METHOD-path), so it is the single source of the endpoint identity. The adapters' ALIAS constants
  # must match that derived value (pinned by MeshAliasContractTest).
  #
  # Per-endpoint feature toggles live here too, tri-state (unset inherits app.mesh.defaults):
  #   time-limiter.enabled    (default true)  - whether mesh derives + overrides that endpoint's TimeLimiter budget
  #   circuit-breaker.enabled (default false) - whether mesh derives that endpoint's slow-call CircuitBreaker knob
  # `false` does NOT disable the R4j backend - it leaves that backend's own config untouched (BackendToggle).
  #
  # Shared default for every endpoint, under app.mesh.defaults (drop the `# ` to apply):
  #   defaults:
  #     circuit-breaker:
  #       enabled: true                        # let mesh derive the slow-call threshold for ALL endpoints
  #     time-limiter:
  #       enabled: true
  #
  # ...or per endpoint, which wins over the default in BOTH directions - here CB on, TimeLimiter left untouched:
  #     - triplet: "/endpoint/apis.example.com/POST/v8/agreements/products/lookup"
  #       individual-request-timeout-ms: 400
  #       circuit-breaker:
  #         enabled: true                      # derive this endpoint's slow-call knob (overrides the default off)
  #       time-limiter:
  #         enabled: false                     # keep this endpoint's TimeLimiter at its own resilience4j config
  # (Response validation is NOT a mesh feature - it is switched under app.restclient.validation above.)
  mesh:
    # app.mesh.defaults is omitted: every endpoint sets its own measured anchor, and the policy knobs
    # (max-retries, margins {global-margin-ms, ...}, transport) default in Kotlin. Add a defaults block only to tune.
    endpoints:
      - triplet: "/endpoint/apis.example.com/POST/v8/agreements/products/lookup"
        individual-request-timeout-ms: 400
      - triplet: "/endpoint/api.example.com/GET/v5/access-profiles/by-involved-party/{id}"
        individual-request-timeout-ms: 300
      - triplet: "/endpoint/apis.example.com/POST/v5/involved-parties/lookup"
        individual-request-timeout-ms: 500
      - triplet: "/endpoint/apis.example.com/GET/v6/involved-parties/{uuid}"
        individual-request-timeout-ms: 400

resilience4j:
  # TimeLimiter, Bulkhead and CircuitBreaker are declared for EVERY backend below. All three primitives sit in
  # the call path unconditionally (BlockingResilienceDecorator applies all three, regardless of the app.mesh
  # toggles), so leaving one undeclared does not mean "off" - it means that backend silently runs on
  # Resilience4j's own defaults, at values nobody had chosen and nothing documented. The instance keys are the
  # mesh-derived aliases and must stay in sync with the adapters' ALIAS constants (pinned by
  # ResilienceConfigContractTest).
  #
  # The TimeLimiter entries have a second job: Resilience4j's Boot configuration materialises exactly the
  # `instances.<name>` listed here, and the mesh customizer (MeshResilienceCustomizers) sets the derived budget
  # on every endpoint whose time-limiter toggle is on (the default) WHILE that instance is built. An alias an
  # endpoint uses but this block does not declare still gets an instance (Resilience4j creates one for the
  # customizer) - on the registry default, not on lap-backend, silently; MeshResilienceStartupGuard therefore
  # fails the start and names the missing key. MeshResilienceShippedConfigTest boots the auto-configuration
  # against this file.
  timelimiter:
    configs:
      lap-backend:
        # A fallback only: the mesh customizer sets every enabled instance to
        # the derived timeout (see docs/timeouts-bulkheads-threads.md), so 3s is only the fallback for an
        # endpoint whose time-limiter toggle is switched off. cancel-running-future is the Resilience4j default,
        # written out because BlockingResilienceDecorator relies on it: the budget expiry must interrupt the
        # worker, or the call would run on after its caller was released.
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      apis-example-com-POST-v8-agreements-products-lookup:
        base-config: lap-backend
      api-example-com-GET-v5-access-profiles-by-involved-party:
        base-config: lap-backend
      apis-example-com-POST-v5-involved-parties-lookup:
        base-config: lap-backend
      apis-example-com-GET-v6-involved-parties:
        base-config: lap-backend

  # The values below are the Resilience4j defaults, written out DELIBERATELY: making them visible and
  # reviewable is the point, and pinning them here means a library upgrade cannot change this application's
  # behaviour behind its back. Tune them against real traffic - the notes say what each one costs.
  bulkhead:
    configs:
      lap-backend:
        # Bound by the SHARED connection pool, not chosen per backend: every endpoint talks to the same local
        # sidecar through one Apache HttpClient pool of app.mesh.defaults.transport.max-connections (100). With
        # four backends, 4 x 25 = 100 - the bulkheads shed load exactly as the pool runs out, rather than
        # letting callers pile up on pendingAcquire. Raising this without raising max-connections moves the
        # queueing into the pool, where pending-acquire-timeout-ms (200) fails them anyway, only later and
        # with a less obvious error. ResilienceConfigContractTest enforces sum(max-concurrent-calls) <=
        # max-connections.
        max-concurrent-calls: 25
        # Fail fast rather than queue: the same choice the mesh transport already makes for the pool. A
        # waiting caller burns its TimeLimiter budget (1.1-1.6s per the derived ladder) doing nothing.
        max-wait-duration: 0
    instances:
      apis-example-com-POST-v8-agreements-products-lookup:
        base-config: lap-backend
      api-example-com-GET-v5-access-profiles-by-involved-party:
        base-config: lap-backend
      apis-example-com-POST-v5-involved-parties-lookup:
        base-config: lap-backend
      apis-example-com-GET-v6-involved-parties:
        base-config: lap-backend

  circuitbreaker:
    configs:
      lap-backend:
        # NOTE: a bulkhead rejection is NOT counted as a backend failure - see ClientSideFailurePolicy, which
        # the mesh customizer installs on every instance below while Resilience4j builds it. That invariant
        # lives in code on purpose, so it cannot be lost by an edit to this block.
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        # CAVEAT worth knowing before relying on this breaker: COUNT_BASED with a minimum of 100 means it
        # cannot open until 100 calls have been recorded in the window. On a low-traffic backend that point
        # may be reached rarely or never, so the breaker is closer to dormant than to protective. Kept at the
        # default because choosing a smaller window is a traffic-dependent decision and needs real numbers;
        # a TIME_BASED window is the usual answer once they exist.
        sliding-window-size: 100
        minimum-number-of-calls: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 10
        # The slow-call detector is INERT here, and deliberately so: the TimeLimiter already cancels every
        # call at the mesh-derived budget (~1.1-1.6s), so nothing survives long enough to reach a 60s slow-call
        # threshold. Mesh can derive a meaningful threshold instead - that is what app.mesh's per-endpoint
        # circuit-breaker.enabled toggle switches on (default off); it then also pins the rate to 100%.
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 60s
    instances:
      apis-example-com-POST-v8-agreements-products-lookup:
        base-config: lap-backend
      api-example-com-GET-v5-access-profiles-by-involved-party:
        base-config: lap-backend
      apis-example-com-POST-v5-involved-parties-lookup:
        base-config: lap-backend
      apis-example-com-GET-v6-involved-parties:
        base-config: lap-backend
