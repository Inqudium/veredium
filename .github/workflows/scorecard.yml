name: Scorecard

# OpenSSF Scorecard: an outside assessment of this repository's
# supply-chain posture (pinned dependencies, token permissions, branch
# protection, dangerous workflow patterns, SAST and vulnerability
# gating, ...). It complements the other two security workflows rather
# than overlapping them: ci.yml checks the dependencies we consume,
# codeql.yml checks the code we write, and this one checks how the
# project is set up and released.

on:
  push:
    branches: [main]
  # Weekly: the checks and their heuristics evolve, and several of them
  # observe repository settings that can change without a commit.
  schedule:
    - cron: "41 6 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to the repository's Security tab.
      security-events: write
      # OIDC token, required by publish_results - which in turn is what
      # makes the public badge and the api.scorecard.dev entry work.
      id-token: write
    steps:
      # persist-credentials: false is required by scorecard-action - it
      # analyses the checkout and must not find a credentialed remote.
      # Actions pinned to commit SHAs, as everywhere in this repository.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Note: the Branch-Protection check reads the "protect-main"
      # repository RULESET (deletion + force-push protection, required
      # "build" status check), which the default token can see; the
      # equivalent classic branch-protection rules remain configured but
      # are unreadable without an admin-scoped PAT in repo_token.
      # PR/review requirements are deliberately absent (single-maintainer,
      # direct-push workflow), so the check scores partial by design -
      # an accepted trade-off: no secret to provision and rotate.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
