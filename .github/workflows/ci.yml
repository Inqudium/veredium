name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a newly published advisory surfaces even when nothing was
  # committed - a scan that only runs on changes cannot see the world
  # changing around unchanged code.
  schedule:
    - cron: "17 4 * * 1"

# Least privilege, stated explicitly rather than inherited from the
# repository default (which an admin setting could widen for a workflow
# that also runs on fork pull requests).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not to mutable tags: a retagged
      # or compromised release would otherwise execute here with the
      # workflow token. Dependabot (github-actions ecosystem) proposes the
      # bumps and keeps the trailing version comment in sync.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # The KDoc reference check as a PR gate. Dokka runs with failOnWarning, so
      # an unresolvable [Symbol] link fails this step - here, in the pull
      # request, instead of in the Docs workflow after the merge. The rendered
      # site is discarded; only the verdict counts.
      - name: Check the KDoc references (Dokka, failOnWarning)
        # `package` before the goal: a bare `dokka:dokka` runs no lifecycle, so the
        # reactor has no veredium-core jar to hand the client modules, and a fresh
        # runner has none in its local repository either; veredium-test-support is
        # listed because the client modules compile their tests against it.
        run: mvn --batch-mode --no-transfer-progress -pl veredium-core,veredium-test-support,veredium-restclient,veredium-webclient -DskipTests -Djacoco.skip=true package dokka:dokka

      # Dokka reads KDoc only: a `[Symbol]` link in a `//` line comment looks
      # checked and is not - a rename leaves it standing with the authority of
      # a verified link. Such a comment names the symbol in backticks or moves
      # into the enclosing declaration's KDoc, where Dokka sees it.
      - name: Check that no line comment carries a KDoc-style [Symbol] link
        run: |
          if grep -rnE '^\s*//.*\[[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)?\]' --include='*.kt' veredium-*/src/main veredium-*/src/test; then
            echo '::error::[Symbol] links in // line comments are not checked by Dokka - use backticks, or move the sentence into KDoc'
            exit 1
          fi

      # A guide section cited by NUMBER drifts the moment a heading is inserted,
      # and nothing turns red. Cite the heading instead - it is the Markdown
      # anchor, and a rename shows up in a grep. RFC section numbers are stable
      # and stay. Test comments and the reference configurations count too: the
      # rationale blocks are published on the test-evidence page.
      - name: Check that no comment cites a guide section by number
        run: |
          if grep -rnE '§[0-9]|\bsection [0-9]' --include='*.kt' --include='*.yml' veredium-*/src/main veredium-*/src/test | grep -v 'RFC '; then
            echo '::error::cite the guide section by its heading, not its number - headings are the anchors, numbers move'
            exit 1
          fi

      # Assessment reports under docs/assessment are dated snapshots (ADR
      # README, "Evidence"); the ADR is the reference target a comment cites.
      # A report path or a finding number in a comment is proof-keeping that
      # ages with the next round. A bare date as a blame anchor is fine and
      # passes.
      - name: Check that no comment cites an assessment report
        run: |
          if grep -rnE 'docs/assessment/|(analysis|review|audit|report) of 20[0-9]{2}-|\bfinding [0-9]' --include='*.kt' veredium-*/src/main veredium-*/src/test; then
            echo '::error::cite the ADR (or keep only the date), not the assessment report or its finding number'
            exit 1
          fi

      # The modules were ported from another project. Its consumers, documents,
      # incidents and removed components (the exchange diary) mean nothing here,
      # and a comment that leans on them explains nothing to a reader of this
      # repository: state the constraint itself, or point at the ADRs or
      # veredium-restclient/docs/decisions.md.
      - name: Check that no source leans on the origin project
        run: |
          if grep -rniE 'sync-bridge|helm-lap|helm-mesh|\bPoC\b|ADR-006|runbook|backfill|CustomerProducts|\bdiary\b' veredium-*/src; then
            echo '::error::state the constraint itself - the origin project, its documents and the removed diary are not part of this repository'
            exit 1
          fi

      # A production class named in KDoc by its full name in backticks is one
      # pair of brackets away from a link Dokka checks (CONTRIBUTING, "Tests");
      # in backticks a rename leaves it standing unnoticed.
      - name: Check that KDoc links production classes instead of naming them
        run: |
          if grep -rnE '^\s*\*.*`eu\.inqudium\.veredium(\.[a-z]+)+\.[A-Z][A-Za-z]*(\.[A-Za-z]+)?`' --include='*.kt' veredium-*/src/main; then
            echo '::error::write [eu.inqudium.veredium...Class] instead of the name in backticks, so Dokka checks it'
            exit 1
          fi

      # ktlint 1.8 and the Kotlin compiler leave unused imports alone; one whose
      # name survives only in a `//` comment looks like use.
      - name: Check that no Kotlin source has an unused import
        run: python3 .github/scripts/check-unused-imports.py

      # The rationale block of every test is published on the test-evidence page;
      # the generator reads exactly the three labels, in order, up to a bare `//`
      # line. A fourth label or a missing separator would publish a garbled entry
      # after the merge - this fails the pull request instead.
      - name: Check the shape of the test rationale blocks
        run: python3 .github/scripts/generate-test-catalog.py --check

      # Repo-local script instead of a third-party reporting action (this
      # workflow pins actions to SHAs; a summary needs no new supply-chain
      # surface). Runs on failure too, so a red build still shows which
      # classes failed without digging through the log.
      - name: Publish test summary
        if: always()
        run: python3 .github/scripts/surefire-summary.py

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # An SBOM of the RESOLVED graph, not a scan of pom.xml: most versions
      # here are managed by the Spring Boot BOM and never appear in pom.xml,
      # so only the resolved graph states what actually ships. The aggregate
      # goal folds every module into one root target/bom.json; test-scoped
      # dependencies are excluded (they reach no consumer).
      - name: Generate CycloneDX SBOM of the resolved dependencies
        run: mvn --batch-mode --no-transfer-progress -DskipTests cyclonedx:makeAggregateBom

      # Fails the job when a dependency is affected by a known advisory.
      # No API key needed (OSV.dev aggregates GHSA, CVE and friends). If an
      # advisory is ever unfixable and provably not exploitable here, record
      # it with a dated rationale in osv-scanner.toml rather than removing
      # this gate - see CONTRIBUTING.md.
      - name: Scan the SBOM against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=./target/bom.json

      # Kept regardless of the scan result, so a red run leaves behind the
      # exact dependency set it judged.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          if-no-files-found: error
