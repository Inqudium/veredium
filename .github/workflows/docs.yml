name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      # The test-evidence page is generated from EVERY module's tests.
      - veredium-core/**
      - veredium-restclient/**
      - veredium-webclient/**
      - pom.xml
      - .github/workflows/docs.yml
      - .github/scripts/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not mutable tags - this workflow runs with
      # pages: write and id-token: write, so a retagged action release
      # would be a direct supply-chain path. Dependabot proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Installed from a fully resolved, hash-pinned requirements file:
      # a compromised or yanked release cannot silently enter the docs
      # build, and the published site is reproducible. Regenerate after
      # changing the doc toolchain with:
      #   pip-compile --generate-hashes --strip-extras \
      #     --output-file=.github/docs-requirements.txt <(echo mkdocs-material)
      # Dependabot keeps the pins current (pip ecosystem, /.github).
      - name: Install MkDocs Material
        run: pip install --require-hashes -r .github/docs-requirements.txt

      # Runs the suite so the published test evidence and coverage always
      # describe the commit being deployed - the site never shows numbers
      # a human typed. A red suite blocks the docs deploy on purpose:
      # stale docs beat docs that certify a broken build.
      - name: Run the test suite (Surefire results + JaCoCo report)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate the test-evidence page
        run: python3 .github/scripts/generate-test-catalog.py

      # Copies the module guides (which live next to their module
      # sources) into the docs_dir with rewritten links, so the site
      # renders them instead of linking to GitHub.
      - name: Generate the guide pages
        run: python3 .github/scripts/generate-guide-pages.py

      - name: Build site
        run: mkdocs build --strict

      # --strict does not fail when a nav entry points at an EXCLUDED file - MkDocs only logs an
      # INFO line and drops the page. The generated pages are asserted by path.
      - name: Assert the generated pages made it into the site
        run: |
          for page in guides/veredium-core/GUIDE guides/veredium-restclient/GUIDE guides/veredium-webclient/GUIDE tests/test-evidence; do
            test -f "site/$page/index.html" || { echo "::error::missing page: $page"; exit 1; }
          done

      # Per module: the Dokka Maven plugin has no aggregate mode, so each
      # module renders its own API reference under /api/<module>/.
      - name: Build API reference (Dokka)
        # `package` before the goal: a bare `dokka:dokka` runs no lifecycle, so the
        # reactor has no veredium-core jar to hand the client modules, and a fresh
        # runner has none in its local repository either.
        run: mvn --batch-mode --no-transfer-progress -pl veredium-core,veredium-test-support,veredium-restclient,veredium-webclient -DskipTests -Djacoco.skip=true package dokka:dokka

      - name: Add API references to site
        run: |
          mkdir -p site/api
          for module in veredium-core veredium-restclient veredium-webclient; do
            cp -r "$module"/target/dokka "site/api/$module"
          done

      # The cross-module report of veredium-coverage is /coverage/ itself (a
      # class counts as covered when ANY module's tests run it); the badge is
      # derived from the same report, so the two cannot disagree.
      - name: Add coverage report and badge to site
        run: |
          mkdir -p site
          cp -r veredium-coverage/target/site/jacoco-aggregate site/coverage
          python3 .github/scripts/generate-coverage-badge.py site/coverage/badge.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
